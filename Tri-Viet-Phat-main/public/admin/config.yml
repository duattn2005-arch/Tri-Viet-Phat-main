# Decap CMS — trang quản trị nội dung tại /admin
# Mỗi lần bấm "Xuất bản", nội dung được commit lên GitHub; GitHub Actions tự build và tải web lên hosting (2–4 phút).
# Đường dẫn tính từ gốc repo, nên có tiền tố "Tri-Viet-Phat-main/".

backend:
  name: github
  repo: duattn2005-arch/Tri-Viet-Phat-main
  branch: main
  # Cửa sổ đăng nhập: https://thietbiytegroup.com/api/auth.php
  base_url: https://thietbiytegroup.com
  auth_endpoint: api/auth.php
  commit_messages:
    create: 'cms: thêm {{collection}} "{{slug}}"'
    update: 'cms: sửa {{collection}} "{{slug}}"'
    delete: 'cms: xóa {{collection}} "{{slug}}"'
    uploadMedia: 'cms: tải lên "{{path}}"'
    deleteMedia: 'cms: xóa "{{path}}"'

# Chạy thử trên máy: chạy `npx decap-server` ở thư mục gốc repo (thư mục cha), `npm run dev`, rồi mở http://localhost:3000/admin/index.html
local_backend: true

locale: vi
display_url: /

media_folder: Tri-Viet-Phat-main/public/uploads
public_folder: /uploads

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

collections:
  # ---------- Sản phẩm ----------
  - name: products
    label: Sản phẩm
    label_singular: sản phẩm
    folder: Tri-Viet-Phat-main/src/content/products
    format: json
    extension: json
    create: true
    delete: true
    identifier_field: name
    slug: '{{name}}'
    summary: '{{name}} — {{model}}'
    sortable_fields: [order, name]
    fields:
      - { name: name, label: Tên sản phẩm, widget: string }
      - { name: order, label: Thứ tự hiển thị, widget: number, value_type: int, default: 0, hint: Số nhỏ hiện trước. }
      - name: category
        label: Danh mục
        widget: select
        options:
          - { label: Máy xét nghiệm sinh hóa, value: may-xet-nghiem-sinh-hoa }
          - { label: Máy xét nghiệm nước tiểu, value: may-xet-nghiem-nuoc-tieu }
          - { label: Máy xét nghiệm huyết học, value: may-xet-nghiem-huyet-hoc }
          - { label: Máy xét nghiệm điện giải, value: may-xet-nghiem-dien-giai }
          - { label: Máy xét nghiệm miễn dịch, value: may-xet-nghiem-mien-dich }
          - { label: Máy xét nghiệm đông máu, value: may-phan-tich-dong-mau }
          - { label: Máy xét nghiệm HbA1c, value: may-xet-nghiem-hba1c }
          - { label: Hóa chất, thuốc thử xét nghiệm, value: hoa-chat-xet-nghiem }
          - { label: Thiết bị y tế khác, value: thiet-bi-khac }
      - { name: image, label: Ảnh sản phẩm, widget: image }
      - { name: alt, label: Mô tả ảnh (cho SEO), widget: string, required: false, hint: Bỏ trống thì dùng tên sản phẩm. }
      - { name: model, label: Model, widget: string, required: false }
      - { name: brand, label: Hãng, widget: string, hint: 'Ví dụ: DIRUI INDUSTRIAL CO., LTD' }
      - { name: manufacturer, label: Nhà sản xuất, widget: string, required: false }
      - { name: origin, label: Xuất xứ, widget: string, hint: 'Ví dụ: Trung Quốc' }
      - { name: countryOfOrigin, label: Nước sản xuất, widget: string, required: false }
      - { name: shortDesc, label: Mô tả ngắn, widget: text }
      - { name: fullDesc, label: Mô tả đầy đủ, widget: text }
      - name: specs
        label: Thông số kỹ thuật
        label_singular: thông số
        widget: list
        required: false
        summary: '{{fields.label}}: {{fields.value}}'
        fields:
          - { name: label, label: Tên thông số, widget: string }
          - { name: value, label: Giá trị, widget: string }
      - { name: features, label: Đặc điểm nổi bật, label_singular: đặc điểm, widget: list, required: false, field: { name: item, label: Đặc điểm, widget: string } }
      - name: detailedFeatures
        label: Tính năng chi tiết
        label_singular: tính năng
        widget: list
        required: false
        summary: '{{fields.title}}'
        fields:
          - { name: title, label: Tiêu đề, widget: string }
          - { name: desc, label: Mô tả, widget: text }
      - { name: benefits, label: Lợi ích, label_singular: lợi ích, widget: list, required: false, field: { name: item, label: Lợi ích, widget: string } }
      - { name: certifications, label: Chứng nhận, label_singular: chứng nhận, widget: list, required: false, field: { name: item, label: Chứng nhận, widget: string } }
      - { name: detailHtml, label: Bài giới thiệu chi tiết, widget: html, required: false, hint: Nếu có, nội dung này thay cho phần đặc điểm kỹ thuật. }

  # ---------- Tin tức ----------
  - name: news
    label: Tin tức
    label_singular: bài viết
    folder: Tri-Viet-Phat-main/src/content/news
    format: json
    extension: json
    create: true
    delete: true
    slug: '{{title}}'
    summary: '{{title}} ({{date}})'
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Tiêu đề, widget: string }
      - { name: order, label: Thứ tự hiển thị, widget: number, value_type: int, default: 0, hint: Số nhỏ hiện trước. Bài mới để 0 sẽ nằm trên cùng. }
      - { name: date, label: Ngày đăng, widget: string, pattern: ['^\d{2}/\d{2}/\d{4}$', 'Nhập theo dạng ngày/tháng/năm, ví dụ 25/09/2026'] }
      - name: categorySlug
        label: Danh mục
        widget: select
        options:
          - { label: Kiến thức sức khỏe, value: kien-thuc-suc-khoe }
          - { label: Tin y tế, value: tin-y-te }
          - { label: Tin nội bộ, value: tin-noi-bo }
      - { name: image, label: Ảnh đại diện, widget: image }
      - { name: excerpt, label: Tóm tắt, widget: text }
      - { name: content, label: Nội dung, widget: html }

  # ---------- Tài liệu ----------
  - name: documents
    label: Tài liệu
    label_singular: tài liệu
    folder: Tri-Viet-Phat-main/src/content/documents
    format: json
    extension: json
    create: true
    delete: true
    slug: '{{title}}'
    summary: '{{title}} ({{date}})'
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Tiêu đề, widget: string }
      - { name: order, label: Thứ tự hiển thị, widget: number, value_type: int, default: 0, hint: Số nhỏ hiện trước. }
      - { name: date, label: Ngày đăng, widget: string, pattern: ['^\d{2}/\d{2}/\d{4}$', 'Nhập theo dạng ngày/tháng/năm, ví dụ 25/09/2026'] }
      - { name: image, label: Ảnh đại diện, widget: image }
      - { name: excerpt, label: Tóm tắt, widget: text }
      - { name: content, label: Nội dung, widget: html }

  # ---------- Tuyển dụng ----------
  - name: jobs
    label: Tuyển dụng
    label_singular: tin tuyển dụng
    folder: Tri-Viet-Phat-main/src/content/jobs
    format: json
    extension: json
    create: true
    delete: true
    slug: '{{title}}'
    summary: '{{title}} ({{date}})'
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Vị trí tuyển dụng, widget: string }
      - { name: order, label: Thứ tự hiển thị, widget: number, value_type: int, default: 0, hint: Số nhỏ hiện trước. }
      - { name: date, label: Ngày đăng, widget: string, pattern: ['^\d{2}/\d{2}/\d{4}$', 'Nhập theo dạng ngày/tháng/năm, ví dụ 25/09/2026'] }
      - { name: quantity, label: Số lượng, widget: string, hint: 'Ví dụ: 02 người' }
      - { name: location, label: Nơi làm việc, widget: string, hint: 'Ví dụ: Hà Nội' }
      - { name: image, label: Ảnh đại diện, widget: image }
      - { name: excerpt, label: Tóm tắt, widget: text }
      - { name: content, label: Mô tả công việc, widget: html }

  # ---------- Chữ và ảnh của từng trang (src/content/pages.ts) ----------
  - name: pages
    label: Nội dung các trang
    editor: { preview: false }
    files:
      - name: trang-chu
        label: Trang chủ
        file: Tri-Viet-Phat-main/src/content/pages/trang-chu.json
        fields:
          - name: heroSlides
            label: Ảnh bìa chạy (đầu trang)
            label_singular: ảnh bìa
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: image, label: Ảnh (ngang, rộng tối thiểu 1600px), widget: image }
              - { name: alt, label: Mô tả ảnh (cho Google), widget: string }
              - { name: eyebrow, label: Dòng nhỏ phía trên, widget: string }
              - { name: title, label: Tiêu đề lớn, widget: string }
              - { name: desc, label: Mô tả, widget: text }
          - { name: heroButton, label: Chữ trên nút ở ảnh bìa, widget: string }
          - { name: factsImage, label: 'Khối "Những con số" — ảnh nền', widget: image }
          - { name: factsEyebrow, label: 'Khối "Những con số" — dòng nhỏ', widget: string }
          - { name: factsTitle, label: 'Khối "Những con số" — tiêu đề', widget: string }
          - { name: factsIntro, label: 'Khối "Những con số" — mô tả', widget: text }
          - name: facts
            label: Các con số
            label_singular: con số
            widget: list
            summary: '{{fields.value}} {{fields.label}}'
            fields:
              - { name: value, label: Con số, widget: string, hint: 'Ví dụ: 16+, 34, 100%, 2–4h' }
              - { name: label, label: Tên, widget: string }
              - { name: note, label: Ghi chú, widget: string }
          - { name: categoriesTitle, label: 'Khối "Danh mục sản phẩm" — tiêu đề', widget: string }
          - { name: categoriesDesc, label: 'Khối "Danh mục sản phẩm" — mô tả', widget: text }
          - { name: featuredTitle, label: 'Tiêu đề "Sản phẩm nổi bật"', widget: string }
          - { name: aboutImage2, label: 'Khối "Về Trí Việt Phát" — ảnh nhỏ', widget: image, hint: 'Ảnh lớn lấy từ Cài đặt chung → Thông tin công ty → Ảnh trang Giới thiệu' }
          - { name: aboutBadge, label: 'Khối "Về Trí Việt Phát" — chữ dưới số năm', widget: string }
          - { name: aboutEyebrow, label: 'Khối "Về Trí Việt Phát" — dòng nhỏ', widget: string }
          - { name: aboutTitle, label: 'Khối "Về Trí Việt Phát" — tiêu đề', widget: string }
          - { name: aboutText, label: 'Khối "Về Trí Việt Phát" — đoạn giới thiệu', widget: text }
          - name: capabilities
            label: 'Khối "Về Trí Việt Phát" — các thế mạnh'
            label_singular: thế mạnh
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: title, label: Tiêu đề, widget: string }
              - { name: desc, label: Mô tả, widget: text }
          - { name: partnersTitle, label: 'Khối "Đối tác" — tiêu đề', widget: string }
          - { name: partnersDesc, label: 'Khối "Đối tác" — mô tả', widget: text }
          - { name: formImage, label: 'Khối "Yêu cầu tư vấn" — ảnh nền', widget: image }
          - { name: formEyebrow, label: 'Khối "Yêu cầu tư vấn" — dòng nhỏ', widget: string }
          - { name: formTitle, label: 'Khối "Yêu cầu tư vấn" — tiêu đề', widget: string }
          - { name: formIntro, label: 'Khối "Yêu cầu tư vấn" — mô tả', widget: text }
          - { name: formAssurances, label: 'Khối "Yêu cầu tư vấn" — các cam kết', widget: list, field: { name: item, label: Cam kết, widget: string } }
          - { name: quickChips, label: 'Khối "Yêu cầu tư vấn" — nút chọn nhanh', widget: list, field: { name: item, label: Nội dung, widget: string } }
          - { name: newsTitle, label: 'Khối "Tin tức" — tiêu đề', widget: string }
          - { name: newsDesc, label: 'Khối "Tin tức" — mô tả', widget: text }

      - name: gioi-thieu
        label: Trang Giới thiệu
        file: Tri-Viet-Phat-main/src/content/pages/gioi-thieu.json
        fields:
          - { name: bannerTitle, label: Tiêu đề trang, widget: string }
          - { name: bannerSubtitle, label: Dòng mô tả dưới tiêu đề, widget: text }
          - { name: bannerImage, label: Ảnh nền đầu trang, widget: image }
          - { name: storyTag, label: Dòng nhỏ phía trên câu chuyện, widget: string }
          - { name: storyTitle, label: Tiêu đề câu chuyện, widget: string }
          - { name: storyText, label: Nội dung câu chuyện, widget: text, hint: 'Cách một dòng trống để sang đoạn mới. Viết **chữ đậm** bằng hai dấu sao.' }
          - name: stats
            label: Ô số liệu
            label_singular: ô
            widget: list
            summary: '{{fields.value}}'
            fields:
              - { name: icon, label: Biểu tượng, widget: string, hint: 'Tên biểu tượng Google Material Symbols, ví dụ verified' }
              - { name: value, label: Con số, widget: string }
              - { name: label, label: Mô tả, widget: string }
          - name: pillars
            label: Tầm nhìn / Sứ mệnh / Giá trị
            label_singular: mục
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: icon, label: Biểu tượng, widget: string, hint: 'Tên biểu tượng Google Material Symbols, ví dụ flag' }
              - { name: title, label: Tiêu đề, widget: string }
              - { name: desc, label: Nội dung, widget: text }
          - { name: areasTitle, label: 'Khối "Lĩnh vực hoạt động" — tiêu đề', widget: string, hint: 'Danh sách lĩnh vực nằm ở Cài đặt chung → Lĩnh vực kinh doanh' }
          - { name: areasDesc, label: 'Khối "Lĩnh vực hoạt động" — mô tả', widget: string }
          - { name: ctaTitle, label: Khối cuối trang — tiêu đề, widget: string }
          - { name: ctaDesc, label: Khối cuối trang — mô tả, widget: text }
          - { name: ctaButton, label: Khối cuối trang — chữ trên nút, widget: string }

      - name: san-pham
        label: Trang Sản phẩm
        file: Tri-Viet-Phat-main/src/content/pages/san-pham.json
        fields:
          - { name: bannerTitle, label: Tiêu đề trang, widget: string }
          - { name: bannerSubtitle, label: Dòng mô tả dưới tiêu đề, widget: text }
          - { name: bannerImage, label: Ảnh nền đầu trang, widget: image }

      - name: tai-lieu
        label: Trang Tài liệu
        file: Tri-Viet-Phat-main/src/content/pages/tai-lieu.json
        fields:
          - { name: downloadsTitle, label: 'Khối "Tải về" — tiêu đề', widget: string }
          - { name: downloadsDesc, label: 'Khối "Tải về" — mô tả', widget: text }
          - name: downloads
            label: Tài liệu tải về (PDF)
            label_singular: tài liệu
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: title, label: Tên tài liệu, widget: string }
              - { name: file, label: File PDF, widget: file, required: false, hint: 'Chưa tải file lên thì nút "Tải PDF" sẽ nhắc khách gọi hotline.' }
              - { name: code, label: Mã tài liệu, widget: string }
              - { name: fileSize, label: Dung lượng, widget: string, hint: 'Ví dụ: 2.4 MB' }
              - { name: pages, label: Số trang, widget: number, value_type: int, min: 1 }
              - { name: description, label: Mô tả, widget: text }
          - { name: processEyebrow, label: 'Khối "Quy trình bảo trì" — dòng nhỏ', widget: string }
          - { name: processTitle, label: 'Khối "Quy trình bảo trì" — tiêu đề', widget: string }
          - name: processSteps
            label: Các bước bảo trì
            label_singular: bước
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: title, label: Tên bước, widget: string }
              - { name: desc, label: Mô tả, widget: text }
          - { name: faqTitle, label: 'Khối "Câu hỏi thường gặp" — tiêu đề', widget: string }
          - name: faqs
            label: Câu hỏi thường gặp
            label_singular: câu hỏi
            widget: list
            summary: '{{fields.q}}'
            fields:
              - { name: q, label: Câu hỏi, widget: string }
              - { name: a, label: Trả lời, widget: text }

      - name: tuyen-dung
        label: Trang Tuyển dụng
        file: Tri-Viet-Phat-main/src/content/pages/tuyen-dung.json
        fields:
          - { name: bannerTitle, label: Tiêu đề trang, widget: string }
          - { name: companyTitle, label: Khung giới thiệu công ty — tiêu đề, widget: string }
          - { name: companyDesc, label: Khung giới thiệu công ty — nội dung, widget: text }

      - name: lien-he
        label: Trang Liên hệ
        file: Tri-Viet-Phat-main/src/content/pages/lien-he.json
        fields:
          - { name: bannerTitle, label: Tiêu đề trang, widget: string }
          - { name: slogan, label: Câu khẩu hiệu, widget: text }
          - { name: repairTitle, label: 'Khối "Sửa chữa" — tiêu đề', widget: string }
          - { name: repairDesc, label: 'Khối "Sửa chữa" — mô tả', widget: string }
          - { name: formTitle, label: Tiêu đề khung gửi yêu cầu, widget: string }

      - name: chan-trang
        label: Chân trang (cuối mọi trang)
        file: Tri-Viet-Phat-main/src/content/pages/chan-trang.json
        fields:
          - { name: ctaTitle, label: Dải kêu gọi — tiêu đề, widget: string }
          - { name: ctaDesc, label: Dải kêu gọi — mô tả, widget: string }
          - { name: connectText, label: 'Cột "Kết nối" — mô tả', widget: text }
          - { name: bottomNote, label: Dòng cuối cùng, widget: string }

      - name: seo
        label: SEO (tiêu đề và mô tả trên Google)
        file: Tri-Viet-Phat-main/src/content/pages/seo.json
        fields:
          - { name: trang-chu, label: Trang chủ, widget: object, collapsed: true, fields: [{ name: title, label: 'Tiêu đề (tối đa ~60 ký tự, viết đầy đủ kể cả tên công ty)', widget: string }, { name: description, label: Mô tả (tối đa ~160 ký tự), widget: text }] }
          - { name: gioi-thieu, label: Giới thiệu, widget: object, collapsed: true, fields: [{ name: title, label: 'Tiêu đề (web tự thêm " | Trí Việt Phát")', widget: string }, { name: description, label: Mô tả (tối đa ~160 ký tự), widget: text }] }
          - { name: san-pham, label: Sản phẩm, widget: object, collapsed: true, fields: [{ name: title, label: 'Tiêu đề (web tự thêm " | Trí Việt Phát")', widget: string }, { name: description, label: Mô tả (tối đa ~160 ký tự), widget: text }] }
          - { name: tai-lieu, label: Tài liệu, widget: object, collapsed: true, fields: [{ name: title, label: 'Tiêu đề (web tự thêm " | Trí Việt Phát")', widget: string }, { name: description, label: Mô tả (tối đa ~160 ký tự), widget: text }] }
          - { name: tin-tuc, label: Tin tức, widget: object, collapsed: true, fields: [{ name: title, label: 'Tiêu đề (web tự thêm " | Trí Việt Phát")', widget: string }, { name: description, label: Mô tả (tối đa ~160 ký tự), widget: text }] }
          - { name: tuyen-dung, label: Tuyển dụng, widget: object, collapsed: true, fields: [{ name: title, label: 'Tiêu đề (web tự thêm " | Trí Việt Phát")', widget: string }, { name: description, label: Mô tả (tối đa ~160 ký tự), widget: text }] }
          - { name: lien-he, label: Liên hệ, widget: object, collapsed: true, fields: [{ name: title, label: 'Tiêu đề (web tự thêm " | Trí Việt Phát")', widget: string }, { name: description, label: Mô tả (tối đa ~160 ký tự), widget: text }] }

  # ---------- Cài đặt chung ----------
  - name: settings
    label: Cài đặt chung
    editor: { preview: false }
    files:
      - name: company
        label: Thông tin công ty
        file: Tri-Viet-Phat-main/src/content/settings/company.json
        fields:
          - { name: name, label: Tên công ty, widget: string }
          - { name: hotline, label: Hotline chính, widget: string }
          - { name: hotline2, label: Hotline phụ, widget: string }
          - { name: email, label: Email, widget: string }
          - { name: address, label: Địa chỉ, widget: string }
          - { name: licenseNo, label: Mã số doanh nghiệp, widget: string }
          - { name: licensedBy, label: Nơi cấp, widget: string }
          - { name: zaloUrl, label: Link Zalo, widget: string }
          - { name: facebookUrl, label: Link Facebook, widget: string }
          - { name: logoUrl, label: Logo, widget: image }
          - { name: aboutImage, label: Ảnh trang Giới thiệu, widget: image }
          - { name: yearsOfExperience, label: Số năm kinh nghiệm, widget: string, hint: 'Ví dụ: 16+' }
          - { name: genuineReagents, label: Tỷ lệ hóa chất chính hãng, widget: string, hint: 'Ví dụ: 100%' }
          - { name: provincesCovered, label: Số tỉnh thành phục vụ, widget: string }

      - name: partners
        label: Đối tác (logo trang chủ)
        file: Tri-Viet-Phat-main/src/content/settings/partners.json
        fields:
          - name: partners
            label: Danh sách đối tác
            label_singular: đối tác
            widget: list
            summary: '{{fields.name}}'
            fields:
              - { name: name, label: Tên hãng, widget: string }
              - { name: logo, label: Logo, widget: image }
              - { name: url, label: Website của hãng, widget: string, required: false }

      - name: about
        label: Lĩnh vực kinh doanh (trang Giới thiệu)
        file: Tri-Viet-Phat-main/src/content/settings/about.json
        fields:
          - name: businessAreas
            label: Lĩnh vực kinh doanh
            label_singular: lĩnh vực
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: title, label: Tên lĩnh vực, widget: string }
              - { name: desc, label: Mô tả, widget: text }

      - name: testimonials
        label: Đánh giá khách hàng
        file: Tri-Viet-Phat-main/src/content/settings/testimonials.json
        fields:
          - name: testimonials
            label: Danh sách đánh giá
            label_singular: đánh giá
            widget: list
            summary: '{{fields.title}} {{fields.name}} — {{fields.facility}}'
            fields:
              - { name: isPlaceholder, label: Dữ liệu mẫu (ẩn khỏi web), widget: boolean, default: false, hint: Bật lên thì đánh giá này không hiện trên web. }
              - { name: title, label: Học hàm / học vị, widget: string, required: false, hint: 'Ví dụ: TS. BS.' }
              - { name: name, label: Họ tên, widget: string }
              - { name: role, label: Chức vụ, widget: string }
              - { name: facility, label: Đơn vị công tác, widget: string }
              - { name: location, label: Tỉnh / thành phố, widget: string }
              - { name: avatarUrl, label: Ảnh đại diện, widget: image, required: false }
              - { name: quote, label: Nội dung đánh giá, widget: text }
              - { name: rating, label: Số sao (1–5), widget: number, value_type: int, min: 1, max: 5, default: 5 }
              - { name: datePosted, label: Ngày đánh giá, widget: string, hint: 'Ví dụ: 15/08/2025' }
              - name: kpi
                label: Chỉ số nổi bật
                widget: object
                required: false
                fields:
                  - { name: label, label: Nội dung, widget: string, required: false, hint: 'Ví dụ: +140% năng suất' }
                  - { name: trend, label: Xu hướng, widget: select, required: false, options: [{ label: Tăng, value: up }, { label: Giảm, value: down }] }
